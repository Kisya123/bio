<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Кися</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(15, 15, 15, 0.7);
            --accent-white: #ffffff;
            --github-bg: #24292e;
            --tg-bg: #0088cc;
            --text-dim: #666666;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% -10%, #1a1a2e 0%, #050505 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 45px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: appEntrance 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appEntrance {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .nick-section {
            margin-bottom: 25px;
        }

        .nick-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .nick-value {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Нераскрываемый спойлер */
        .name-section {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .label-small {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spoiler-box {
            position: relative;
            width: 150px;
            height: 30px;
            background: #151515;
            border-radius: 6px;
            overflow: hidden;
            pointer-events: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .spoiler-box::after {
            content: "";
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.35;
            animation: noiseMove 0.1s infinite steps(2);
        }

        @keyframes noiseMove {
            0% { transform: translate(0,0); }
            50% { transform: translate(-1%, 1%); }
            100% { transform: translate(1%, -1%); }
        }

        .device-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .device-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-label { font-size: 0.7rem; color: #555; font-weight: 700; text-transform: uppercase; }
        .device-val { font-size: 0.85rem; font-weight: 500; color: #bbb; }

        .email-display {
            font-size: 0.8rem;
            color: #444;
            margin-bottom: 25px;
            font-family: monospace;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            margin-bottom: 12px;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        .btn-tg { background: var(--tg-bg); color: white; }
        .btn-gh { background: var(--github-bg); color: white; border: 1px solid #333; }

        .btn svg { width: 22px; height: 22px; fill: currentColor; }

        .footer-note {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #333;
        }
    </style>
</head>
<body>
